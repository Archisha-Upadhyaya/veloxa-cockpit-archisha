# PostgREST speaks at the root ("/employee_profiles"). The Supabase JS client
# always calls "<url>/rest/v1/<table>". This tiny gateway keeps the app's
# Supabase client code unchanged in a local Docker instance.
server {
  listen 8000;
  server_name _;

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    default_type text/plain;
    return 200 "ok\n";
  }
}
