# Local, self-contained Veloxa Cockpit.
#
# The same Postgres schema and seed data used by a hosted Supabase project run
# here. PostgREST exposes the database through the Supabase-compatible API the
# app already uses, so every route and every migration works without a hosted
# Supabase project.
#
#   docker compose up --build
#
# Data lives in the named volume `veloxa-postgres` and survives rebuilds.
# Set GEMINI_API_KEY in .env.local for hosted-quality AI. Without it, the app
# uses deterministic local embeddings and deterministic fallbacks.
#
# Host ports are configurable so the stack can run beside a local dev server:
#   VELOXA_APP_PORT=3100 VELOXA_API_PORT=3101 VELOXA_DB_PORT=55432 docker compose up --build

x-local-supabase-key: &local_supabase_key "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoidmVsb3hhIiwiaXNzIjoidmVsb3hhLWxvY2FsIn0.dBCaZ-c4Js5QL-_12oMrRqBu6MqaxD8NkFUYvWv-7mc"
x-local-jwt-secret: &local_jwt_secret "veloxa-local-jwt-secret-at-least-32-chars"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: veloxa
      POSTGRES_USER: veloxa
      POSTGRES_PASSWORD: veloxa_local_only
    ports:
      - "${VELOXA_DB_PORT:-5432}:5432"
    volumes:
      - veloxa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veloxa -d veloxa"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: veloxa_local_only
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./scripts/docker-migrate.sh:/docker-migrate.sh:ro
    entrypoint: ["/bin/sh", "/docker-migrate.sh"]

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgresql://veloxa:veloxa_local_only@db:5432/veloxa
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: veloxa
      PGRST_JWT_SECRET: *local_jwt_secret
      PGRST_SERVER_PORT: 3000
      PGRST_LOG_LEVEL: info

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      rest:
        condition: service_started
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${VELOXA_API_PORT:-3001}:8000"

  seed:
    build:
      context: .
      target: tools
    depends_on:
      gateway:
        condition: service_started
    env_file:
      - path: .env.local
        required: false
    environment:
      SUPABASE_URL: http://gateway:8000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:${VELOXA_API_PORT:-3001}
      SUPABASE_SECRET_KEY: *local_supabase_key
    command:
      - sh
      - -c
      - |
        until node -e "fetch('http://gateway:8000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"; do sleep 2; done
        ./node_modules/.bin/tsx scripts/seed-supabase.ts

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:${VELOXA_APP_PORT:-3000}
      SUPABASE_URL: http://gateway:8000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:${VELOXA_API_PORT:-3001}
      SUPABASE_SECRET_KEY: *local_supabase_key
      VELOXA_DATA_ROOM_PATH: /app/Veloxa_Hackathon_Release_Packs
    volumes:
      - ./Veloxa_Hackathon_Release_Packs:/app/Veloxa_Hackathon_Release_Packs:ro
    ports:
      - "${VELOXA_APP_PORT:-3000}:3000"

  bootstrap:
    image: curlimages/curl:8.10.1
    depends_on:
      app:
        condition: service_started
    environment:
      APP_URL: http://app:3000
    volumes:
      - ./scripts/docker-bootstrap.sh:/docker-bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/docker-bootstrap.sh"]

volumes:
  veloxa-postgres:
