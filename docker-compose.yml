services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: veloxa
      POSTGRES_USER: veloxa
      POSTGRES_PASSWORD: veloxa_local_only
    ports:
      - "5432:5432"
    volumes:
      - veloxa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veloxa -d veloxa"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://veloxa:veloxa_local_only@db:5432/veloxa
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  veloxa-postgres:
